[project]
name = "triadllm"
version = "0.5.0"
description = "Terminal UI for proposal-validation-consolidation LLM workflows across OpenAI, Mistral, and compatible backends."
readme = "README.md"
authors = [
    { name = "David R. Lopez B", email = "ibitato@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "mistralai>=1.12.4",
    "openai>=2.26.0",
    "httpx>=0.27.0",
    "platformdirs>=4.9.4",
    "pydantic>=2.12.5",
    "pygments>=2.20.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
    "textual>=8.0.2",
]

[project.scripts]
triad = "triadllm:main"
triadllm = "triadllm:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.12",
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "SIM117", "UP042", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["triadllm"]

[tool.mypy]
python_version = "3.13"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "dist/"]

[[tool.mypy.overrides]]
module = ["triadllm.app", "triadllm.providers", "triadllm.tools", "triadllm.tools.*", "triadllm.runtime", "triadllm.ui", "triadllm.ui.*"]
ignore_errors = true
